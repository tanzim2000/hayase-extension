# build.yml — GitHub Actions workflow for hayase-extension
#
# Triggers automatically when you push changes to src/, tests/, build.mjs,
# package.json, or this workflow file itself.
#
# What it does:
#   1. Spins up a Linux machine in the cloud
#   2. Installs Node.js and dependencies (including Vitest)
#   3. Runs all tests — if any fail, the workflow stops here
#   4. Runs the build script (node build.mjs)
#   5. Updates the "last verified" date in README.md
#   6. If dist/ or README changed, commits and pushes back to your repo
#
# You never need to touch dist/ manually — this bot handles it.
# Tests must pass before any build or commit happens.

name: build

on:
  push:
    branches: [main]
    paths:
      # Only trigger when these files change — no point rebuilding for README edits
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'build.mjs'
      - '.github/workflows/build.yml'
  
  # Allows you to manually trigger the workflow from GitHub's Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Give the bot permission to commit back to your repo
    permissions:
      contents: write

    steps:
      # Step 1 — Check out your repo so the bot can read your files
      - uses: actions/checkout@v5

      # Step 2 — Install Node.js 24
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Step 3 — Install all dependencies including Vitest
      - run: npm install

      # Step 4 — Run all tests
      # If any test fails, the workflow stops here — nothing gets built or committed
      - name: Run tests
        run: npm run test

      # Step 5 — Run the build script → generates dist/*.js
      - run: npm run build

      # Step 6 — Update "last verified" date in README.md
      # Rewrites the line between <!-- LAST_CHECKED --> markers with today's date (UTC).
      # Runs after a successful build so the date only updates when everything works.
      - name: Update last verified date in README
        run: |
          DATE=$(date -u '+%B %d, %Y at %H:%M UTC')
          sed -i "s|> 🕐 Sources last verified:.*|> 🕐 Sources last verified: $DATE|" README.md

      # Step 7 — If dist/ or README changed, commit and push
      # If nothing changed, skip the commit
      - name: Commit built bundles if changed
        run: |
          if git diff --quiet -- dist/ README.md && ! git ls-files --others --exclude-standard dist/ | grep -q .; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ README.md
          git commit -m "build: refresh bundles and update last verified date"
          git push
